<div class="mb-3">
    {% if field.field.widget.input_type == "checkbox" %}
        <div class="form-check form-switch pt-2">
            {{ field }}
            <label class="form-check-label fw-semibold" for="{{ field.id_for_label }}">
                {{ field.label }}
                {% if field.field.required %}<span class="text-danger ms-1">*</span>{% endif %}
            </label>
        </div>
    {% else %}
        <label for="{{ field.id_for_label }}" class="form-label">
            {{ field.label }}
            {% if field.field.required %}<span class="text-danger ms-1">*</span>{% endif %}
        </label>
        {{ field }}
    {% endif %}

    {% if field.help_text %}
        <div class="form-text text-muted small">{{ field.help_text }}</div>
    {% endif %}

    {% if field.errors %}
        {% for error in field.errors %}
            <div class="invalid-feedback d-block"><i class="fa-solid fa-circle-exclamation me-1"></i>{{ error }}</div>
        {% endfor %}
    {% endif %}
</div>
