{% if messages %}
<div class="row mb-3">
    <div class="col-12">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show border-0 shadow-sm d-flex align-items-center" role="alert">
            {% if message.tags == 'success' %}
                <i class="fa-solid fa-circle-check fs-5 me-2 text-success"></i>
            {% elif message.tags == 'danger' or message.tags == 'error' %}
                <i class="fa-solid fa-circle-xmark fs-5 me-2 text-danger"></i>
            {% elif message.tags == 'warning' %}
                <i class="fa-solid fa-triangle-exclamation fs-5 me-2 text-warning"></i>
            {% else %}
                <i class="fa-solid fa-circle-info fs-5 me-2 text-info"></i>
            {% endif %}
            <div class="flex-grow-1">{{ message }}</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
